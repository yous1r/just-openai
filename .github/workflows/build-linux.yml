name: release-linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.4'
  PLUGIN_MODULE: go

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.PLUGIN_MODULE }}/go.sum
      - name: Run tests
        working-directory: ${{ env.PLUGIN_MODULE }}
        run: go test ./...

  prepare-release:
    name: prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build-linux:
    name: build linux-${{ matrix.goarch }}
    needs: [test, prepare-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build shared library
        env:
          GO_VERSION: ${{ env.GO_VERSION }}
          GOARCH: ${{ matrix.goarch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          # manylinux2014 carries a devtoolset GCC, so the resulting .so keeps
          # the same GLIBC 2.17 baseline as the official CLIProxyAPI Linux builds.
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              set -euo pipefail
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /tmp/go
              mkdir -p /tmp/go
              tar -C /tmp/go -xzf "/tmp/${go_archive}"
              export PATH="/tmp/go/go/bin:${PATH}"
              export GOCACHE=/tmp/gocache GOPATH=/tmp/gopath
              cd go
              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" \
                go build -buildvcs=false -buildmode=c-shared -o /src/dist/openai-anthropic-messages.so .
              rm -f /src/dist/openai-anthropic-messages.h
            '
      - name: Package archive
        run: |
          set -euo pipefail
          asset_arch="${{ matrix.goarch }}"
          pkg_dir="dist/pkg"
          mkdir -p "$pkg_dir"
          cp dist/openai-anthropic-messages.so "$pkg_dir/"
          cp README.md LICENSE "$pkg_dir/"
          tar -C "$pkg_dir" -czf "dist/openai-anthropic-messages-linux-${asset_arch}.tar.gz" \
            openai-anthropic-messages.so README.md LICENSE
          (
            cd dist
            sha256sum "openai-anthropic-messages-linux-${asset_arch}.tar.gz" > "openai-anthropic-messages-linux-${asset_arch}.tar.gz.sha256"
          )
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: openai-anthropic-messages-linux-${{ matrix.goarch }}
          path: |
            dist/openai-anthropic-messages-linux-${{ matrix.goarch }}.tar.gz
            dist/openai-anthropic-messages-linux-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/openai-anthropic-messages-linux-*.tar.gz dist/openai-anthropic-messages-linux-*.tar.gz.sha256)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "expected packaged assets, found none" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
