name: release-linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.4'
  PLUGIN_MODULE: go

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.PLUGIN_MODULE }}/go.sum
      - name: Run tests
        working-directory: ${{ env.PLUGIN_MODULE }}
        run: go test ./...

  prepare-release:
    name: prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build-linux:
    name: build linux-${{ matrix.goarch }} (glibc 2.17)
    needs: [test, prepare-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.PLUGIN_MODULE }}/go.sum
      - name: Build shared library
        env:
          GOARCH: ${{ matrix.goarch }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          # pypa manylinux2014 image: CentOS 7 base with a glibc 2.17
          # toolchain, so the .so only requires glibc >= 2.17 and loads on
          # every mainstream glibc host (the official Release binary is a
          # glibc build; musl hosts would need a separate artifact). The Go
          # toolchain is mounted from the runner (no in-container downloads).
          go_root="$(go env GOROOT)"
          docker run --rm \
            -v "$PWD:/src" \
            -v "${go_root}:${go_root}" \
            -w /src \
            -e PATH="$PATH" \
            -e GOROOT="${go_root}" \
            -e GOARCH="$GOARCH" \
            -e GOCACHE=/tmp/gocache \
            -e GOPATH=/tmp/gopath \
            "$IMAGE" \
            sh -euc '
              set -eu
              # manylinux2014 ships gcc under devtoolset-10, not on PATH.
              # (the devtoolset enable script cannot run under set -u: it
              # expands MANPATH which is unset in this container)
              export PATH="/opt/rh/devtoolset-10/root/usr/bin:${PATH}"
              command -v gcc >/dev/null || { echo "gcc not found"; exit 1; }
              cd go
              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" CC=gcc \
                go build -buildvcs=false \
                -ldflags="-extldflags=-static-libgcc" \
                -buildmode=c-shared -o /src/dist/openai-anthropic-messages.so .
              rm -f /src/dist/openai-anthropic-messages.h
              if command -v readelf >/dev/null 2>&1; then
                echo "NEEDED libraries:"
                readelf -d /src/dist/openai-anthropic-messages.so | grep NEEDED || true
              fi
            '
      - name: Package archive
        run: |
          set -euo pipefail
          asset_arch="${{ matrix.goarch }}"
          pkg_dir="dist/pkg"
          mkdir -p "$pkg_dir"
          cp dist/openai-anthropic-messages.so "$pkg_dir/"
          cp README.md LICENSE "$pkg_dir/"
          tar -C "$pkg_dir" -czf "dist/openai-anthropic-messages-linux-${asset_arch}.tar.gz" \
            openai-anthropic-messages.so README.md LICENSE
          (
            cd dist
            sha256sum "openai-anthropic-messages-linux-${asset_arch}.tar.gz" > "openai-anthropic-messages-linux-${asset_arch}.tar.gz.sha256"
          )
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: openai-anthropic-messages-linux-${{ matrix.goarch }}
          path: |
            dist/openai-anthropic-messages-linux-${{ matrix.goarch }}.tar.gz
            dist/openai-anthropic-messages-linux-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/openai-anthropic-messages-linux-*.tar.gz dist/openai-anthropic-messages-linux-*.tar.gz.sha256)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "expected packaged assets, found none" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
