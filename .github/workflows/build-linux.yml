name: release-linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.4'
  PLUGIN_MODULE: go

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.PLUGIN_MODULE }}/go.sum
      - name: Run tests
        working-directory: ${{ env.PLUGIN_MODULE }}
        run: go test ./...

  prepare-release:
    name: prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build-linux:
    name: build linux-${{ matrix.goarch }} (musl static)
    needs: [test, prepare-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            musl_triple: x86_64-linux-musl
          - goarch: arm64
            musl_triple: aarch64-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build shared library
        env:
          GO_VERSION: ${{ env.GO_VERSION }}
          GOARCH: ${{ matrix.goarch }}
          MUSL_TRIPLE: ${{ matrix.musl_triple }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          # musl.cc cross toolchain: statically linked against musl, so the .so
          # has no dynamic libc dependency and loads on glibc and musl hosts.
          curl -fsSL "https://musl.cc/${MUSL_TRIPLE}-cross.tgz" -o /tmp/musl-cross.tgz
          rm -rf "/tmp/${MUSL_TRIPLE}-cross"
          tar -C /tmp -xzf /tmp/musl-cross.tgz
          export PATH="/tmp/${MUSL_TRIPLE}-cross/bin:${PATH}"
          export GOCACHE=/tmp/gocache GOPATH=/tmp/gopath
          cd go
          CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" CC="${MUSL_TRIPLE}-gcc" \
            go build -buildvcs=false \
            -ldflags="-extldflags=-static" \
            -buildmode=c-shared -o "$GITHUB_WORKSPACE/dist/openai-anthropic-messages.so" .
          rm -f "$GITHUB_WORKSPACE/dist/openai-anthropic-messages.h"
      - name: Package archive
        run: |
          set -euo pipefail
          asset_arch="${{ matrix.goarch }}"
          pkg_dir="dist/pkg"
          mkdir -p "$pkg_dir"
          cp dist/openai-anthropic-messages.so "$pkg_dir/"
          cp README.md LICENSE "$pkg_dir/"
          tar -C "$pkg_dir" -czf "dist/openai-anthropic-messages-linux-${asset_arch}.tar.gz" \
            openai-anthropic-messages.so README.md LICENSE
          (
            cd dist
            sha256sum "openai-anthropic-messages-linux-${asset_arch}.tar.gz" > "openai-anthropic-messages-linux-${asset_arch}.tar.gz.sha256"
          )
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: openai-anthropic-messages-linux-${{ matrix.goarch }}
          path: |
            dist/openai-anthropic-messages-linux-${{ matrix.goarch }}.tar.gz
            dist/openai-anthropic-messages-linux-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/openai-anthropic-messages-linux-*.tar.gz dist/openai-anthropic-messages-linux-*.tar.gz.sha256)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "expected packaged assets, found none" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
